[package]
name = "bench"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
core_affinity = "0.8.3"
csv = "1.4.0"
futures = "0.3.34"
hdrhistogram = "7.6.0"
mongodb = "3.9.1"
neo4rs = "0.8.0"
quanta = "0.12.6"
rand = "0.10.3"
rand_chacha = "0.10.0"
rand_distr = "0.6.0"
redis = { version = "1.7.0", features = ["tokio-comp"] }
rtrb = "0.4.0"
scylla = "1.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt", "time", "net", "macros"] }
toml = "1.1.6"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_Media"] }
